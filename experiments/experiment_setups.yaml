euclidean_1d:
  results_dir: /vol/water-futures/quality/mega_mp3/Results/euclidean1_d
  experiments:
    - boundary_condition:
        style: gaussian
        loc: 40
        scale: 11
        index:
          - 0
      initial_value: null
      flow_field:
        kind: sine_pos
        value: 0.3
      domain:
        x: 100
      time: 100
    - boundary_condition:
        style: gaussian
        loc: 40
        scale: 11
        index:
          - 0
      initial_value:
        style: gaussian
        loc: 50
        scale: 12
        index:
          - 0
      flow_field:
        kind: sine_pos
        value: 0.3
      domain:
        x: 100
      time: 100
    - boundary_condition:
        style: gaussian
        loc: 38
        scale: 18
        index:
          - 0
      initial_value: null
      flow_field:
        kind: sine_pos
        value: 1.0
      domain:
        x: 100
      time: 100
    - boundary_condition:
        style: gaussian
        loc: 38
        scale: 18
        index:
          - 0
      initial_value:
        style: gaussian
        loc: 50
        scale: 12
        index:
          - 0
      flow_field:
        kind: sine_pos
        value: 1.0
      domain:
        x: 100
      time: 100


    - boundary_condition: null
      initial_value:
        style: gaussian
        loc: 30
        scale: 10
      flow_field:
        kind: sine
        value: 2.0
      domain:
        x: 100
      time: 100

tuning:
  root: /vol/water-futures/quality/mega_mp3
