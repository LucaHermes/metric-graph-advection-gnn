wds:
  results_dir: Results/wds_experiments
  sources_at:
    - n300
    - n115
  time:
    n_seconds: 43200
    hydraulic_step: 60
    quality_timestep: 1
    pattern_step: 60
    pattern_n_waves: 3
    seed: 42
  cT: 200
  Tau: 500
  defaults:
    inp_file: networks/l_town_no_tanks.inp
  experiments:
    - id: 0
      msx_file: networks/ltown.msx
      remove_inline_nodes: false
    - id: 1
      msx_file: networks/simple_reactions.msx
      remove_inline_nodes: false
    - id: 2
      msx_file: networks/ltown.msx
      remove_inline_nodes: true
    - id: 3
      msx_file: networks/simple_reactions.msx
      remove_inline_nodes: true

pde_gnn:
  root: /vol/water-futures/quality/mega_mp3
  results_dir: Results/learning_reactions_leakage_fix_2
  time:
    n_seconds: 43200
    hydraulic_step: 60
    quality_timestep: 1
    pattern_step: 60
    pattern_n_waves: 3
    seed: 42
  cT: 1
  Tau: 700
  defaults:
    data_splits:
      train: 1000
      test: 200
      validation: 200
    train:
      inp_file: networks/Hanoi.inp
      sources_at:
        - "1"
      equal_demand_at_nodes: false
    test:
      Hanoi:
        inp_file: networks/Hanoi.inp
        sources_at:
          - "1"
        equal_demand_at_nodes: false
      L-Town:
        inp_file: networks/l_town_no_tanks.inp
        sources_at:
          - R1
          - R2
        equal_demand_at_nodes: false
  experiments:
    - id: 0
      train:
        msx_file: networks/simple_reactions.msx
        data_path: dataset
      test:
        Hanoi:
          msx_file: networks/simple_reactions.msx
          data_path: dataset
        L-Town:
          msx_file: networks/simple_reactions.msx
          data_path: dataset
    - id: 1
      train:
        msx_file: networks/ltown.msx
        data_path: dataset_no_reactions
      test:
        Hanoi:
          msx_file: networks/ltown.msx
          data_path: dataset_no_reactions
        L-Town:
          msx_file: networks/ltown.msx
          data_path: dataset_no_reactions
    - id: 2
      train:
        msx_file: networks/complicated_reactions.msx
        data_path: dataset_complicated
      test:
        Hanoi:
          msx_file: networks/complicated_reactions.msx
          data_path: dataset_complicated
        L-Town:
          msx_file: networks/complicated_reactions.msx
          data_path: dataset_complicated

